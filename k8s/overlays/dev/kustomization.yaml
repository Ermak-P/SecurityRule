apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Dev overlay: one replica, reduced resources, dev authentication user
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: security-rule
  - patch: |-
      - op: replace
        path: /data/Authentication__DevelopmentUser
        value: "dev-user"
    target:
      kind: ConfigMap
      name: app-config
