apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Prod overlay: scale up replicas, set prod hostname in Ingress
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: security-rule
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "security-rule.your-domain.com"  # Replace with prod hostname
    target:
      kind: Ingress
      name: security-rule
