name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/SecurityRule.slnx

      - name: Build
        run: dotnet build src/SecurityRule.slnx --no-restore

      - name: Run unit & integration tests
        run: dotnet test src/SecurityRule.Tests/ --no-build --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
          retention-days: 14

  e2e-tests:
    name: E2E Tests (Playwright + Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/SecurityRule.slnx

      - name: Build E2E project
        run: dotnet build src/SecurityRule.E2E.Tests/ --no-restore

      - name: Install Playwright Chromium with system dependencies
        run: pwsh src/SecurityRule.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install chromium --with-deps

      - name: Run E2E tests
        run: dotnet test src/SecurityRule.E2E.Tests/ --no-build
